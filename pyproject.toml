[project]
name = "bm25-idf-distortion-experiment"
version = "0.1.0"
description = "Experiment showing how Elasticsearch BM25 IDF gets distorted when multiple tenants are stored in a shared index and filtered at query time"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Taiki Mori" },
]
dependencies = [
    "elasticsearch>=9.2.1",
    "datasets>=4.4.2",
    "sudachipy>=0.6.10",
    "sudachidict-core>=20260116",
    "openai>=1.0.0",
    "pdfplumber>=0.11.8",
    "requests>=2.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build]
include = ["scripts/**/*.py"]
